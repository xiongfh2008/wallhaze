# =============================================================================
# api.wallhaze.com — WallHaze Fastify API reverse proxy (host Nginx).
#
# Install (operator, AFTER deployment authorization):
#   sudo cp nginx/api.wallhaze.com.conf /etc/nginx/sites-available/api.wallhaze.com
#   sudo ln -s /etc/nginx/sites-available/api.wallhaze.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Backup/rollback FIRST:
#   sudo cp -a /etc/nginx/sites-available /root/nginx-sites-backup-$(date +%F)
#   Rollback: sudo rm /etc/nginx/sites-enabled/api.wallhaze.com && sudo nginx -t && sudo systemctl reload nginx
#
# This file MUST NOT touch api.arcunara.com, api.vidsavey.com, vidsavey.com
# or the default site — it is a standalone server block.
#
# TLS: Cloudflare Full (strict) requires a certificate the CDN trusts.
# Simplest compliant option on this host is Cloudflare Origin CA (15y cert,
# only Cloudflare trusts it — exactly what Full strict needs). Let's Encrypt
# (certbot --nginx -d api.wallhaze.com) also works if DNS is already proxied.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.wallhaze.com;

    # ACME HTTP-01 (certbot) passes through; everything else redirects.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.wallhaze.com;

    # --- Replace with the real cert paths after issuing (see header) -------
    ssl_certificate     /etc/nginx/ssl/api.wallhaze.com.pem;
    ssl_certificate_key /etc/nginx/ssl/api.wallhaze.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:wallhaze_api_ssl:5m;

    # --- Security headers ---------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Proxy to the wallhaze-app compose API (loopback only) -------------
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Video streaming / long generations
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    access_log /var/log/nginx/api.wallhaze.com.access.log;
    error_log  /var/log/nginx/api.wallhaze.com.error.log warn;
}
